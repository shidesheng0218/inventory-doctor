name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit + e2e tests
        run: pnpm vitest run

      - name: Build
        run: pnpm build

      - name: MCP stdout discipline (no console.log in src/)
        run: |
          if grep -rn "console\.log" src/; then
            echo "FAIL: console.log found in src/ — stdout is the MCP JSON-RPC channel"
            exit 1
          fi

      - name: Smoke: built CLI answers --help
        run: node dist/cli.js --help
