name: debug-npx
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          echo "=== npm version ==="; npm -v; node -v
          echo "=== npm config ==="; npm config list
          echo "=== proxy/registry env ==="; env | grep -iE 'proxy|registry' || echo "(none)"
          echo "=== npm view ==="; npm view inventory-doctor@0.4.0 version
          echo "=== npx direct ==="; npx -y inventory-doctor@0.4.0 --version; echo "npx-exit=$?"
          echo "=== npm exec form ==="; npm exec -y --package=inventory-doctor@0.4.0 -- inventory-doctor --version; echo "exec-exit=$?"
