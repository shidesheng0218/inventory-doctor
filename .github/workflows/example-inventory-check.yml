name: Example inventory check

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diff fixture snapshots with the local action
        uses: ./
        with:
          source-a: fixtures/shopify-store-a.csv
          source-b: fixtures/shopify-store-b.csv
          # The repo fixtures intentionally contain critical findings.
          fail-on-critical: false
