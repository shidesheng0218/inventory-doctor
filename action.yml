name: inventory-doctor
description: Diff two inventory snapshots (CSV files, Shopify/WooCommerce stores, or saved snapshots) and upload the diagnostic report as an artifact. Exits 1 when critical findings exist, failing the job.
author: shidesheng0218
branding:
  icon: activity
  color: orange

inputs:
  source-a:
    description: First source — CSV path, `store:<name>`, or `snapshot:<name>[@<id>]`
    required: true
  source-b:
    description: Second source — CSV path, `store:<name>`, or `snapshot:<name>[@<id>]`
    required: true
  config:
    description: Path to inventory-doctor.json (only needed outside default locations)
    required: false
  format:
    description: Report format — terminal, markdown, or html
    required: false
    default: terminal
  extra-args:
    description: Additional CLI flags appended verbatim to the diff command
    required: false
  fail-on-critical:
    description: Whether critical findings fail the step (CLI exit code 1)
    required: false
    default: 'true'
  version:
    description: npm version of inventory-doctor to run
    required: false
    default: '0.4.0'

outputs:
  report:
    description: Path to the generated report file
    value: ${{ steps.diff.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Run inventory-doctor diff
      id: diff
      shell: bash
      # NOTE: no `env:` block here on purpose — the `secrets` context is not
      # available inside composite action definitions. Callers pass credential
      # env vars through their own workflow/job `env:` (see README); those
      # variables are inherited by this step.
      run: |
        # npx resolves commands against the LOCAL project first. Inside a
        # checkout of this very repo, npm 10 sees package.json's matching
        # name+bin and runs a phantom local bin — but dist/ isn't in a fresh
        # clone ("inventory-doctor: not found"). So: absolutize caller-relative
        # file paths, then run npx from a neutral directory.
        abs() { echo "$(cd "$(dirname "$1")" 2>/dev/null && pwd -P)/$(basename "$1")"; }
        SOURCES=()
        for src in "${{ inputs.source-a }}" "${{ inputs.source-b }}"; do
          if [ -f "$src" ]; then SOURCES+=("$(abs "$src")"); else SOURCES+=("$src"); fi
        done
        CONFIG_ARG=""
        if [ -n "${{ inputs.config }}" ]; then
          if [ -f "${{ inputs.config }}" ]; then
            CONFIG_ARG="--config $(abs "${{ inputs.config }}")"
          else
            CONFIG_ARG="--config ${{ inputs.config }}"
          fi
        fi
        STATUS=0
        RUN_DIR="$(mktemp -d)"
        cd "$RUN_DIR"
        npx -y inventory-doctor@${{ inputs.version }} diff \
          "${SOURCES[0]}" "${SOURCES[1]}" \
          --format "${{ inputs.format }}" \
          ${CONFIG_ARG} \
          ${{ inputs.extra-args }} \
          > "$GITHUB_WORKSPACE/inventory-doctor-report.txt" || STATUS=$?
        echo "report=${GITHUB_WORKSPACE}/inventory-doctor-report.txt" >> "$GITHUB_OUTPUT"
        if [ "$STATUS" -eq 1 ] && [ "${{ inputs.fail-on-critical }}" != "true" ]; then
          echo "::warning::inventory-doctor found critical findings (fail-on-critical=false)"
          exit 0
        fi
        exit "$STATUS"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: inventory-doctor-report
        path: inventory-doctor-report.txt
        if-no-files-found: ignore
