name: inventory-doctor
description: Diff two inventory snapshots (CSV files, Shopify/WooCommerce stores, or saved snapshots) and upload the diagnostic report as an artifact. Exits 1 when critical findings exist, failing the job.
author: shidesheng0218
branding:
  icon: activity
  color: orange

inputs:
  source-a:
    description: First source — CSV path, `store:<name>`, or `snapshot:<name>[@<id>]`
    required: true
  source-b:
    description: Second source — CSV path, `store:<name>`, or `snapshot:<name>[@<id>]`
    required: true
  config:
    description: Path to inventory-doctor.json (only needed outside default locations)
    required: false
  format:
    description: Report format — terminal, markdown, or html
    required: false
    default: terminal
  extra-args:
    description: Diagnostic flags only, as a JSON string array or whitespace-separated flags (for example --drift-abs 3 --map A=B)
    required: false
  fail-on-critical:
    description: Whether critical findings fail the step (CLI exit code 1)
    required: false
    default: 'true'
  version:
    description: npm version of inventory-doctor to run
    required: false
    default: '0.5.0'

outputs:
  report:
    description: Path to the generated report file
    value: ${{ steps.diff.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Run inventory-doctor diff
      id: diff
      shell: bash
      env:
        INPUT_SOURCE_A: ${{ inputs.source-a }}
        INPUT_SOURCE_B: ${{ inputs.source-b }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
        INPUT_FAIL_ON_CRITICAL: ${{ inputs.fail-on-critical }}
      run: |
        set -euo pipefail
        # Resolve inputs before npx leaves the caller's working directory.
        ARGS_FILE="$(mktemp)"
        RUN_DIR=""
        trap 'rm -f "$ARGS_FILE"; if [ -n "$RUN_DIR" ]; then rm -rf "$RUN_DIR"; fi' EXIT
        node "$GITHUB_ACTION_PATH/scripts/run-action.mjs" > "$ARGS_FILE"
        ARGS=()
        while IFS= read -r -d '' arg; do ARGS+=("$arg"); done < "$ARGS_FILE"
        RUN_DIR="$(mktemp -d)"
        cd "$RUN_DIR"
        STATUS=0
        npx -y "inventory-doctor@$INPUT_VERSION" "${ARGS[@]}" > "$GITHUB_WORKSPACE/inventory-doctor-report.txt" || STATUS=$?
        echo "report=${GITHUB_WORKSPACE}/inventory-doctor-report.txt" >> "$GITHUB_OUTPUT"
        if [ "$STATUS" -eq 1 ] && [ "$INPUT_FAIL_ON_CRITICAL" = "false" ]; then
          echo "::warning::inventory-doctor found critical findings (fail-on-critical=false)"
          exit 0
        fi
        exit "$STATUS"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: inventory-doctor-report
        path: inventory-doctor-report.txt
        if-no-files-found: ignore
